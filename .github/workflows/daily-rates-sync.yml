name: Monthly 1st 9AM Digital Bank Rates Sync (All 4 Banks)

on:
  schedule:
    # 02:00 UTC = 09:00 AM Asia/Ho_Chi_Minh (UTC+7) on the 1st of every month
    - cron: '0 2 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-rates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run all 4 digital bank rate scrapers (TNEX, TIMO, LIOBANK, CAKE)
        run: npm run scrape:all

      - name: Commit and push updated rates if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain src/data/)" ]; then
            git add src/data/
            git commit -m "chore(rates): monthly 1st 9:00 AM sync for TNEX, TIMO, LIOBANK & CAKE"
            git push
          else
            echo "No rate changes detected today."
          fi
